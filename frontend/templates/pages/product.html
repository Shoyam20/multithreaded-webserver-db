<div class="crumbs"><a href="/">Home</a> › <a href="/products?category={{categoryId}}">{{categoryName}}</a> › {{name}}</div>

<div class="pd">
  <div class="thumb big" style="background:{{tint}}">{{icon}}</div>

  <div class="info">
    <span class="chip">{{categoryName}}</span>
    <h1>{{name}}</h1>
    <p>{{description}}</p>
    <div class="price">{{price}} <small>inclusive of all taxes</small></div>
    {{{stockLabel}}}

    <div class="buybox">{{{buyBox}}}</div>

    <ul class="facts">
      <li>💵 Cash on Delivery available</li>
      <li>📦 Live stock — reserved when you place the order</li>
      <li>🔐 Order history saved to your account</li>
    </ul>
  </div>
</div>

{{{related}}}

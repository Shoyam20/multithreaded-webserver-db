<div class="shop">
  <aside class="side">
    <div class="grp">
      <h3>Categories</h3>
      {{{sideLinks}}}
    </div>
    <div class="grp">
      <h3>Price (₹)</h3>
      <form method="GET" action="/products">
        {{{hiddenFilters}}}
        <div class="pricebox">
          <input name="min" type="number" min="0" placeholder="Min" value="{{filterMin}}">
          <input name="max" type="number" min="0" placeholder="Max" value="{{filterMax}}">
        </div>
        <button class="btn block" type="submit">Apply</button>
      </form>
    </div>
  </aside>

  <section>
    <div class="toolbar">
      <div><h1>{{heading}}</h1><span class="count">{{count}}</span></div>
      <div class="sort">Sort: {{{sortLinks}}}</div>
    </div>
    {{{results}}}
  </section>
</div>

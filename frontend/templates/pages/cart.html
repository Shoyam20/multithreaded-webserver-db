<h1 class="page-title">🛒 Shopping Cart</h1>

<div class="two">
  <div class="panel">
    <h2>Items ({{units}})</h2>
    {{{lines}}}
  </div>

  <aside class="panel">
    <h2>Order summary</h2>
    <div class="sumrow"><span>Items ({{units}})</span><span>{{total}}</span></div>
    <div class="sumrow"><span>Delivery</span><span class="free">FREE</span></div>
    <div class="sumrow total"><span>Total</span><span>{{total}}</span></div>
    <a class="btn accent lg block gap" href="/checkout">Proceed to checkout</a>
    <a class="btn ghost block gap" href="/products">Continue shopping</a>
  </aside>
</div>

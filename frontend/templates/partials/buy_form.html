<form method="POST" action="/cart/add" class="buyform">
  <input type="hidden" name="product_id" value="{{id}}">
  <div class="qty">
    <button type="button" onclick="stepQty(this,-1)">−</button>
    <input type="number" name="quantity" value="1" min="1" max="{{maxQty}}">
    <button type="button" onclick="stepQty(this,1)">+</button>
  </div>
  <button class="btn accent lg" type="submit">Add to Cart</button>
  <button class="btn lg" type="submit" name="buy" value="1">Buy Now</button>
</form>

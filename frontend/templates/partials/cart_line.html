<div class="line">
  <a href="/product?id={{id}}"><div class="thumb" style="background:{{tint}}">{{icon}}</div></a>
  <div>
    <a class="nm" href="/product?id={{id}}">{{name}}</a>
    <div class="sub">{{price}} each</div>
    {{{warning}}}
    <div class="acts">
      <form method="POST" action="/cart/update" class="inline">
        <input type="hidden" name="product_id" value="{{id}}">
        <div class="qty">
          <button type="button" onclick="stepQty(this,-1)">−</button>
          <input type="number" name="quantity" value="{{quantity}}" min="1" max="{{maxQty}}">
          <button type="button" onclick="stepQty(this,1)">+</button>
        </div>
        <button class="btn ghost" type="submit">Update</button>
      </form>
      <form method="POST" action="/cart/remove" class="inline">
        <input type="hidden" name="product_id" value="{{id}}">
        <button class="linkbtn" type="submit">🗑️ Remove</button>
      </form>
    </div>
  </div>
  <div class="rt">{{subtotal}}</div>
</div>

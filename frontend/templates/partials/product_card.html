<div class="card">
  <a href="/product?id={{id}}">
    <div class="thumb" style="background:{{tint}}">{{icon}}{{{tags}}}</div>
  </a>
  <div class="cbody">
    <a class="cname" href="/product?id={{id}}">{{name}}</a>
    <div class="cdesc">{{description}}</div>
    <div class="price">{{price}}</div>
    {{{stockLabel}}}
    <div class="cbottom">{{{buyButton}}}</div>
  </div>
</div>

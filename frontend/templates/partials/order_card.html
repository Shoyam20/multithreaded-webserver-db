<div class="order">
  <div class="ohead">
    <div>ORDER PLACED<b>{{date}}</b></div>
    <div>TOTAL<b>{{total}}</b></div>
    <div>PAYMENT<b>{{paymentMethod}} · <span class="pill {{paymentClass}}">{{paymentStatus}}</span></b></div>
    <div>ORDER #<b>{{id}}</b></div>
    <div>STATUS<b><span class="pill {{statusClass}}">{{status}}</span></b></div>
  </div>
  <div class="obody">{{{items}}}</div>
  <div class="ofoot">{{{footer}}}</div>
</div>

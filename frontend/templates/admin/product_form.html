<div class="panel narrowpanel">
  {{#if error}}<div class="err">{{error}}</div>{{/if}}

  <form method="POST" action="/admin/products/save">
    <input type="hidden" name="id" value="{{productId}}">

    <div class="field"><label>Name</label>
      <input name="name" maxlength="100" value="{{name}}" required></div>

    <div class="field"><label>Description</label>
      <input name="description" maxlength="255" value="{{description}}"></div>

    <div class="row2">
      <div class="field"><label>Price (₹)</label>
        <input name="price" type="number" step="0.01" min="0" value="{{price}}" required></div>
      <div class="field"><label>Stock (units)</label>
        <input name="stock" type="number" min="0" value="{{stock}}" required></div>
    </div>

    <div class="field"><label>Category</label>
      <select name="category_id" required>
        <option value="">Choose…</option>
        {{#each categoryOptions}}<option value="{{id}}" {{#if selected}}selected{{/if}}>{{name}}</option>{{/each}}
      </select></div>

    <button class="btn accent" type="submit">Save product</button>
    <a class="btn ghost" href="/admin/products">Cancel</a>
  </form>
</div>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{title}} — Server Sync Admin</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="adminbody">
  <aside class="sidebar">
    <a class="logo" href="/admin">Server <span>Sync</span> <small>Admin</small></a>
    <nav>
      <a class="{{nav_dashboard}}" href="/admin">📊 Dashboard</a>
      <a class="{{nav_orders}}" href="/admin/orders">📦 Orders</a>
      <a class="{{nav_products}}" href="/admin/products">🛍️ Products &amp; stock</a>
      <a class="{{nav_categories}}" href="/admin/categories">🗂️ Categories</a>
      <a class="{{nav_users}}" href="/admin/users">👥 Users</a>
    </nav>
    <div class="sidefoot">
      <div class="who">Signed in as<br><b>{{userName}}</b></div>
      <a href="/">← Back to store</a>
      <a href="/logout">🚪 Sign out</a>
    </div>
  </aside>

  <main class="adminmain">
    {{{notice}}}
    <h1 class="page-title">{{title}}</h1>
    {{{content}}}
  </main>

  <script src="/static/js/app.js"></script>
</body>
</html>

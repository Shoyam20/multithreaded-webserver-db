<p><a href="/admin/orders">← All orders</a></p>

<div class="cols">
  <section class="panel">
    <h2>Items</h2>
    <table>
      <tr><th>Product</th><th>Qty</th><th>Price</th><th>Subtotal</th></tr>
      {{{items}}}
      <tr class="totalrow"><td colspan="3">Order total</td><td><b>{{total}}</b></td></tr>
    </table>
  </section>

  <section class="panel">
    <h2>Order #{{id}}</h2>
    <p><b>{{customer}}</b><br><span class="muted">{{email}}</span></p>
    <p class="muted">Placed {{date}}</p>
    <p>Order status: <span class="pill {{statusClass}}">{{status}}</span><br>
       Payment: {{paymentMethod}} · <span class="pill {{paymentClass}}">{{paymentStatus}}</span></p>

    {{{statusForm}}}
  </section>
</div>
